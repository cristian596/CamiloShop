name: Keepalive

# Supabase Free pauses a project after a week without activity. /api/health
# runs a SELECT 1, which counts as activity. Note: GitHub disables scheduled
# workflows after 60 days without commits; re-enable it from the Actions tab.
on:
  schedule:
    - cron: "17 13 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health check
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "::error::Add the HEALTHCHECK_URL secret (https://<your-site>/api/health)"
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 30 "$HEALTHCHECK_URL"
